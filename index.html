<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>釜山自由行手冊 | Busan Travel Guide</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="釜山之旅">
  <link rel="apple-touch-icon" href="https://i.ibb.co/0ppX3mmH/IMG-6699.jpg">
  
  <!-- FontAwesome 標誌庫 -->

  <style>
    :root {
      --bg-color: #F7F6F2;
      --card-bg: #FFFFFF;
      --text-main: #2C2C2A;
      --text-sub: #787774;
      --accent-wood: #8C7A6B;
      --accent-soft-blue: #5B8296;
      --tag-food: #E07A5F;
      --tag-spot: #3D405B;
      --tag-buy: #81B29A;
      --tag-story: #F2CC8F;
      --border-color: #E8E6E1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 95px;
      padding-top: env(safe-area-inset-top);
      letter-spacing: 0.3px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 天氣與倒數卡片 (日式簡約風格) */
    .hero-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .weather-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .weather-temp {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent-soft-blue);
    }

    .countdown-section {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .timer-card {
      flex: 1;
      background: var(--bg-color);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .timer-card .team-name {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .timer-display {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-wood);
      font-variant-numeric: tabular-nums;
    }

    /* 分類頁籤按鈕 */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--accent-wood);
      color: white;
      border-color: var(--accent-wood);
    }

    /* 景點與美食卡片 */
    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .item-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #C5C5C0;
      cursor: pointer;
    }

    .icon-btn.active-heart {
      color: #E07A5F;
    }

    /* 標籤 Tag 風格 */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .tag-food { background: #FDE8E2; color: var(--tag-food); }
    .tag-spot { background: #E8EBF0; color: var(--tag-spot); }
    .tag-buy  { background: #E8F3EE; color: #2D6A4F; }
    .tag-story { background: #FEF5E7; color: #B57A12; }

    .story-box {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-top: 6px;
      background: var(--bg-color);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .map-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      padding: 6px 12px;
      background: #F0EDE6;
      color: var(--accent-wood);
      text-decoration: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 記帳與表單簡約化 */
    .add-form {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .add-form input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg-color);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-wood);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .account-summary {
      background: var(--accent-wood);
      color: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    /* 底部導覽列 */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 11px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .nav-item i {
      font-size: 18px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: var(--accent-wood);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">釜山旅覽 | BUSAN</h1>

        <button class="cat-btn" onclick="filterCategory('C', this)">C. 西面/田浦</button>

        <button class="cat-btn" onclick="filterCategory('E', this)">E. 海雲台</button>

      <!-- 新增自訂景點表單 -->
      <div class="add-form">
        <h3 style="font-size: 14px; margin-bottom: 8px;">＋ 新增自訂景點或筆記</h3>

        <input type="text" id="schedule-time" placeholder="預計時間或類別">
        <input type="text" id="schedule-note" placeholder="備註筆記">
        <button class="btn-submit" onclick="addSchedule()">加入行程清單</button>
      </div>

      <!-- 景點與美食列表 -->
      <div id="schedule-list">
        <!-- 系統自動渲染景點列表 -->
      </div>
    </div>

    <!-- 頁籤二：愛心收藏 -->
    <div id="tab-favorites" class="tab-content">
      <div id="favorites-list">
        <!-- 愛心收藏載入區 -->
      </div>
    </div>

    <!-- 頁籤三：共用記帳 -->
    <div id="tab-expenses" class="tab-content">
      <div class="account-summary">

        <input type="text" id="expense-item" placeholder="品項（例：味贊王燒肉）">

      </div>

      <div id="expenses-list">
        <!-- 記帳載入區 -->
      </div>

  </div>

  <!-- 底部導覽列 -->

    <button class="nav-item active" onclick="switchTab('schedule', '釜山旅覽 | BUSAN', this)">

      // F 海雲台 天空膠囊列車 & 海岸列車

      { cat: 'F', name: '青沙浦紅白雙燈塔', type: 'spot', tag: '打卡景點', story: '經典韓劇經典造景，紅白燈塔映襯海景。' },
      { cat: 'F', name: 'Chuplus 松亭店 吉拿棒', type: 'food', tag: '必吃甜點', story: '現炸香酥吉拿棒佐濃郁冰淇淋。' }
    ];

    // 倒數計時器邏輯 (Team1: 12/27, Team2: 12/31)
    function startCountdowns() {
      const year = 2026; // 自動抓取 2026 年底
      const t1Date = new Date(`${year}-12-27T00:00:00`);
      const t2Date = new Date(`${year}-12-31T00:00:00`);

      function update() {
        const now = new Date();
        
        function format(diff) {
          if (diff <= 0) return "已到達！🎉";
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hrs = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
          const mins = Math.floor((diff / 1000 / 60) % 60).toString().padStart(2, '0');
          const secs = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
          return `${days}天 ${hrs}:${mins}:${secs}`;
        }

        document.getElementById('timer-team1').innerText = format(t1Date - now);
        document.getElementById('timer-team2').innerText = format(t2Date - now);
      }
      setInterval(update, 1000);
      update();
    }
    startCountdowns();

    // 分頁切換
    window.switchTab = function(tabId, title, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('page-title').innerText = title;
      btnElement.classList.add('active');
    };

    // 類別過濾
    let currentFilter = 'ALL';
    window.filterCategory = function(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = cat;
      renderScheduleList();
    };

    // 渲染景點列表
    function renderScheduleList() {
      const scheduleList = document.getElementById('schedule-list');
      scheduleList.innerHTML = '';

      const filtered = currentFilter === 'ALL' 
        ? presetData 
        : presetData.filter(i => i.cat === currentFilter);

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('釜山 ' + item.name)}`;
        
        card.innerHTML = `
          <div class="card-top">
            <div class="item-title">${item.name}</div>
            <div class="card-actions">
              <button class="icon-btn" onclick="toggleLocalFavorite(${index}, this)">
                <i class="fa-regular fa-heart"></i>
              </button>
            </div>
          </div>
          <div class="tag-container">
            <span class="tag ${item.type === 'food' ? 'tag-food' : 'tag-spot'}">${item.tag}</span>
          </div>
          <div class="story-box">${item.story}</div>
          <a href="${mapUrl}" target="_blank" class="map-btn">
            <i class="fa-solid fa-location-dot"></i> Google Maps 導航
          </a>
        `;
        scheduleList.appendChild(card);
      });
    }

    renderScheduleList();

    // 愛心與記帳雲端連動 (Firebase Firestore)
    window.addSchedule = async function() {
      const title = document.getElementById('schedule-title').value;
      const time = document.getElementById('schedule-time').value;
      const note = document.getElementById('schedule-note').value;
      if (!title) return alert('請輸入景點名稱！');

      await addDoc(collection(db, "schedules"), {
        title, time, note, isFavorite: false, createdAt: Date.now()
      });

      document.getElementById('schedule-title').value = '';
      document.getElementById('schedule-time').value = '';
      document.getElementById('schedule-note').value = '';
    };

    // 記帳邏輯
    window.addExpense = async function() {
      const item = document.getElementById('expense-item').value;
      const amount = Number(document.getElementById('expense-amount').value);
      const payer = document.getElementById('expense-payer').value;
      if (!item || !amount) return alert('請填寫品項與金額！');

      await addDoc(collection(db, "expenses"), {
        item, amount, payer: payer || '公款', createdAt: Date.now()
      });

      document.getElementById('expense-item').value = '';
      document.getElementById('expense-amount').value = '';
      document.getElementById('expense-payer').value = '';
    };

    // 實時連動記帳
    onSnapshot(collection(db, "expenses"), (snapshot) => {
      const expensesList = document.getElementById('expenses-list');
      const totalElement = document.getElementById('total-expense');
      expensesList.innerHTML = '';
      let total = 0;

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        total += data.amount;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="card-top">
            <div class="item-title">${data.item}</div>
            <span style="color:var(--tag-food); font-weight:700;">₩ ${data.amount.toLocaleString()}</span>
          </div>
          <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">💳 付款人：${data.payer}</div>
        `;
        expensesList.appendChild(card);
      });

      totalElement.innerText = `₩ ${total.toLocaleString()}`;
    });
  </script>
</body>
</html>

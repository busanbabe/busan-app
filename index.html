<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hello Busan | Hi 2027</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hello Busan">
  <link rel="apple-touch-icon" href="cover.PNG">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF6C8',
            'cream-card': '#FFFFFF',
            'warm-bg': '#F7DFDF',
            'warm-dark': '#5C4E4E',
            'warm-muted': '#8C7C7C',
            'warm-border': '#BBB7E5',
            'gold-highlight': '#EFBDBD',

            'color-a': '#BBB7E5',
            'color-b': '#F7DFDF',
            'color-c': '#DAE9FA',
            'color-d': '#EFBDBD',
            'color-e': '#B6C687',
            'color-f': '#FAF6C8',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --color-lavender: #BBB7E5;
      --color-light-rose: #F7DFDF;
      --color-snow: #DAE9FA;
      --color-baby-pink: #EFBDBD;
      --color-pistachio: #B6C687;
      --color-pale-yellow: #FAF6C8;
      --color-pink: #F98BA9;

      --bg-color: #FAF9F6;
      --text-main: #5C4E4E;
      --text-sub: #8C7C7C;
      --border-color: #EFECE6;

      --color-cat-a: #BBB7E5;
      --color-cat-b: #F7DFDF;
      --color-cat-c: #DAE9FA;
      --color-cat-d: #EFBDBD;
      --color-cat-e: #B6C687;
      --color-cat-f: #FAF6C8;

      --expense-theme: #BBB7E5;
      --expense-btn-color: #B6C687;

      --flip-bg: #F7DFDF;
      --flip-stripe: rgba(255, 255, 255, 0.35);
      --flip-text: #5C4E4E;
      --flip-subtext: #7D6E6E;

      --nav-height: calc(52px + env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(187, 183, 229, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(247, 223, 223, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 50% 70%, rgba(250, 246, 200, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 90% 90%, rgba(239, 189, 189, 0.18) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      padding-bottom: calc(65px + env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
      letter-spacing: 0.3px;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    input, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .app-page {
      display: none;
      width: 100vw;
      min-height: 100vh;
    }
    .app-page.active-page {
      display: block;
    }

    /* 頂部 Header */
    header {
      background: transparent;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 8px 34px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title-text {
      font-family: 'Noto Serif', serif;
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 700;
      color: var(--color-pink);
    }

    .new-year-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .sparkle-icon {
      font-size: clamp(24px, 6vw, 32px);
      cursor: pointer;
      display: inline-block;
      line-height: 1;
      animation: breathePulse 1.2s infinite ease-in-out;
      transition: transform 0.1s ease;
    }
    .sparkle-icon:active { transform: scale(0.75); }

    @keyframes breathePulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(0deg); }
    }

    .container {
      padding: 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    #hero-countdown-card { margin-top: -12px; }

    .weather-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px dashed var(--border-color);
    }
    .weather-temp { font-size: 22px; font-weight: 700; color: var(--text-main); }

    .countdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .countdown-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .countdown-title .title-heart-icon { color: var(--color-pink); font-size: 16px; }

    .flip-clock { display: flex; gap: 8px; justify-content: space-between; width: 100%; }
    .flip-unit { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }

    .flip-card-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 0.82;
      border-radius: 12px;
      background-color: var(--flip-bg);
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 5px, var(--flip-stripe) 5px, var(--flip-stripe) 8px);
      overflow: hidden;
      border: 1px solid var(--text-main);
      display: flex;
      flex-direction: column;
      perspective: 200px;
    }
    .flip-card-wrapper::before, .flip-card-wrapper::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 10px;
      background-color: var(--text-main);
      z-index: 35;
      border-radius: 2px;
    }
    .flip-card-wrapper::before { left: -1px; }
    .flip-card-wrapper::after { right: -1px; }

    .flip-card-half {
      position: absolute;
      left: 0; right: 0; width: 100%; height: 50%;
      overflow: hidden; display: flex; justify-content: center;
      background-color: var(--flip-bg);
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 5px, var(--flip-stripe) 5px, var(--flip-stripe) 8px);
      color: var(--flip-text); font-weight: 800;
      font-size: clamp(30px, 8.5vw, 44px);
    }
    .flip-card-half.top { top: 0; align-items: flex-end; border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom: 2px solid rgba(92, 78, 78, 0.25); }
    .flip-card-half.top span { transform: translateY(50%); }
    .flip-card-half.bottom { bottom: 0; align-items: flex-start; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; border-top: 1px solid rgba(255, 255, 255, 0.6); }
    .flip-card-half.bottom span { transform: translateY(-50%); }

    .flip-card-flipper {
      position: absolute; top: 0; left: 0; width: 100%; height: 50%;
      transform-origin: bottom center; transform-style: preserve-3d; z-index: 25; display: none;
    }
    .flip-card-flipper.flipping { display: block; animation: foldFlipNew 0.5s cubic-bezier(0.3, 0.7, 0.1, 1) forwards; }
    @keyframes foldFlipNew { 0% { transform: rotateX(0deg); } 100% { transform: rotateX(-180deg); } }

    .flipper-face {
      position: absolute; width: 100%; height: 100%; top: 0; left: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; justify-content: center; overflow: hidden;
      background-color: var(--flip-bg);
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 5px, var(--flip-stripe) 5px, var(--flip-stripe) 8px);
      color: var(--flip-text); font-weight: 800; font-size: clamp(30px, 8.5vw, 44px);
    }
    .flipper-face.front { align-items: flex-end; border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom: 2px solid rgba(92, 78, 78, 0.25); }
    .flipper-face.front span { transform: translateY(50%); }
    .flipper-face.back { align-items: flex-start; transform: rotateX(180deg); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; border-top: 1px solid rgba(255, 255, 255, 0.6); }
    .flipper-face.back span { transform: translateY(-50%); }

    .unit-label {
      position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
      font-size: clamp(10px, 2.8vw, 13px); font-weight: 800; color: var(--flip-subtext); letter-spacing: 0.8px; z-index: 35; pointer-events: none;
    }

    .calc-card-bar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 20px; padding: 16px; margin-top: 18px; margin-bottom: 16px; border: 1px solid var(--border-color);
    }
    .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calc-title { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
    .calc-rate-badge { font-size: 11px; color: var(--text-sub); font-weight: 600; }

    .calc-input-box { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; width: 100%; }
    .calc-input-wrap { flex: 1; position: relative; }
    .calc-input-wrap input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px;
      font-size: 14px; font-weight: 700; background: #FAF7F4; color: var(--text-main); outline: none; text-align: right;
    }
    .calc-input-wrap input#quick-twd { padding-right: 38px; }
    .calc-input-wrap input#quick-krw { padding-right: 48px; }
    .calc-input-wrap .unit-tag { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: var(--text-sub); pointer-events: none; }
    .swap-icon-wrap { color: var(--text-sub); font-size: 12px; opacity: 0.7; }

    .tax-free-banner {
      background: #FAF7F4; border: 1px dashed var(--border-color); border-radius: 10px; padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-sub); font-weight: 600; width: 100%;
    }
    .tax-free-banner.reached { background: rgba(182, 198, 135, 0.2); border: 1px solid var(--color-pistachio); color: #5C4E4E; }

    .section-title-label { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .cat-card-btn {
      aspect-ratio: 1 / 1; border-radius: 18px; padding: 14px; border: 1px solid #5C4E4E;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; text-align: center; color: var(--text-main);
    }
    .cat-card-btn:active { transform: scale(0.96); }
    .cat-card-btn[data-cat="A"] { background: var(--color-cat-a); }
    .cat-card-btn[data-cat="B"] { background: var(--color-cat-b); }
    .cat-card-btn[data-cat="C"] { background: var(--color-cat-c); }
    .cat-card-btn[data-cat="D"] { background: var(--color-cat-d); }
    .cat-card-btn[data-cat="E"] { background: var(--color-cat-e); }
    .cat-card-btn[data-cat="F"] { background: var(--color-cat-f); }

    .cat-letter-badge { position: absolute; top: 10px; left: 12px; font-size: 13px; font-weight: 800; color: var(--text-main); opacity: 0.85; }
    .cat-card-title { font-size: 15px; font-weight: 700; color: var(--text-main); line-height: 1.35; }

    .item-card {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border-color); border-left: 5px solid var(--expense-btn-color);
    }
    .item-card.cat-A { border-left-color: var(--color-cat-a); }
    .item-card.cat-B { border-left-color: var(--color-cat-b); }
    .item-card.cat-C { border-left-color: var(--color-cat-c); }
    .item-card.cat-D { border-left-color: var(--color-cat-d); }
    .item-card.cat-E { border-left-color: var(--color-cat-e); }
    .item-card.cat-F { border-left-color: var(--color-cat-f); }
    .item-card.expense-item-card { border-left-color: var(--expense-btn-color); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .item-title { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.35; }
    .card-actions { display: flex; gap: 10px; }
    .icon-btn { background: none; border: none; font-size: 18px; color: #D5CEC7; cursor: pointer; transition: transform 0.2s; }
    .icon-btn:active { transform: scale(1.2); }
    .icon-btn.active-heart { color: var(--color-pink); }

    .story-box { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-top: 6px; background: rgba(250, 247, 244, 0.8); padding: 9px 11px; border-radius: 10px; }
    .map-btn { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 6px 12px; background: rgba(92, 78, 78, 0.08); color: #5C4E4E; text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: 700; }

    /* Bottom Sheet */
    .sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: var(--nav-height); background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .sheet-overlay.active { opacity: 1; pointer-events: auto; }
    .bottom-sheet { position: fixed; left: 0; right: 0; bottom: var(--nav-height); max-width: 680px; margin: 0 auto; max-height: calc(85vh - var(--nav-height)); height: 75vh; background: #FAF9F6; border-top-left-radius: 24px; border-top-right-radius: 24px; z-index: 200; transform: translateY(105%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); border-bottom: none; touch-action: none; }
    .bottom-sheet.active { transform: translateY(0); }

    .sheet-header { padding: 10px 20px 14px; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); cursor: grab; user-select: none; }
    .sheet-handle { width: 38px; height: 5px; background: #D4CBC0; border-radius: 3px; align-self: center; margin-bottom: 10px; }
    .sheet-title-bar { display: flex; justify-content: center; align-items: center; }
    .sheet-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .sheet-body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 記帳頁面 */
    .add-form { background: rgba(255, 255, 255, 0.95); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .add-form input, .add-form select { width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; background: #FAF7F4; color: var(--text-main); outline: none; }
    .form-row-inline { display: flex; gap: 8px; margin-bottom: 8px; }
    .form-row-inline select { flex: 1; margin-bottom: 0; }
    .form-row-inline input { flex: 2; margin-bottom: 0; }
    .payer-section-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .payer-select-container { display: flex; gap: 6px; margin-bottom: 12px; width: 100%; }
    .payer-chip { flex: 1; padding: 6px 4px; font-size: 12px; font-weight: 600; border-radius: 20px; border: 1px solid var(--border-color); background: #FAF7F4; color: var(--text-sub); cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .payer-chip.selected { background: var(--text-main); color: #FFFFFF; border-color: var(--text-main); }
    .select-all-btn { font-size: 11px; color: var(--text-main); background: none; border: none; cursor: pointer; font-weight: 700; padding: 2px 4px; }
    .twd-hint { font-size: 12px; color: var(--text-main); margin-bottom: 10px; font-weight: 600; padding-left: 2px; }
    .btn-submit { width: 100%; background: var(--text-main); color: white; border: none; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .dash-box { background: linear-gradient(135deg, #BBB7E5 0%, #A49EE0 100%); color: #5C4E4E; border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 105px; border: 1px solid #5C4E4E; }
    .dash-title { font-size: 12px; font-weight: 600; opacity: 0.95; }
    .dash-main-val { font-size: clamp(19px, 5.2vw, 23px); font-weight: 800; margin-top: 4px; }
    .dash-sub-val { font-size: 11px; opacity: 0.9; margin-top: 2px; }
    .expense-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
    .expense-btn { padding: 5px 10px; font-size: 11px; border-radius: 8px; border: 1px solid var(--border-color); background: #FAF7F4; cursor: pointer; color: var(--text-sub); }
    .expense-btn.delete { color: var(--color-pink); border-color: rgba(249, 139, 169, 0.3); background: #FFF9F8; }
    .empty-fav-msg { text-align: center; padding: 50px 20px; color: var(--text-sub); font-size: 14px; }

    /* Bottom Nav Bar */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px);
      display: flex; justify-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-color); z-index: 300;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; color: var(--text-sub);
      text-decoration: none; font-size: 11px; border: none; background: none; cursor: pointer; flex: 1;
    }
    .nav-item i { font-size: 18px; margin-bottom: 3px; }
    .nav-item.active-nav { color: var(--text-main); font-weight: 700; }
    .nav-item.active-favorites { color: var(--color-pink); font-weight: 700; }
    .nav-item.active-expenses { color: var(--color-lavender); font-weight: 700; }

    /* Toast 提示 */
    #toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;
      background: var(--text-main); color: #FAF6C8; font-size: 12px; padding: 10px 18px;
      border-radius: 99px; opacity: 0;
      transition: opacity 0.3s ease; pointer-events: none; display: flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>

  <!-- PAGE 1: 首頁 (HOME) -->
  <div class="app-page active-page" id="page-home">
    <header>
      <div class="header-title-text">Hello Busan</div>
      <div class="new-year-badge">
        <span class="header-title-text">Hi 2027</span>
        <span class="sparkle-icon" id="sparkle-btn">✨</span>
      </div>
    </header>

    <div class="container">
      <!-- 倒數與天氣卡片 -->
      <div class="hero-card" id="hero-countdown-card">
        <div class="weather-box">
          <div>
            <div style="font-size: 12px; color: var(--text-sub);">釜山今日天氣</div>
            <div style="font-size: 14px; font-weight: 500; margin-top:2px;" id="weather-text">載入天氣中... 🌤️</div>
          </div>
          <div class="weather-temp" id="weather-temp">--°C</div>
        </div>

        <div class="reunion-countdown-section">
          <div class="countdown-header">
            <span class="countdown-title">
              <i class="fa-solid fa-heart title-heart-icon"></i> 集合倒數
            </span>
          </div>
          <div class="flip-clock" id="clock-reunion">
            <div class="flip-unit" data-unit="days">
              <div class="flip-card-wrapper">
                <div class="flip-card-half top"><span>00</span></div>
                <div class="flip-card-half bottom"><span>00</span></div>
                <div class="flip-card-flipper"><div class="flipper-face front"><span>00</span></div><div class="flipper-face back"><span>00</span></div></div>
              </div>
              <span class="unit-label">DAY</span>
            </div>
            <div class="flip-unit" data-unit="hours">
              <div class="flip-card-wrapper">
                <div class="flip-card-half top"><span>00</span></div>
                <div class="flip-card-half bottom"><span>00</span></div>
                <div class="flip-card-flipper"><div class="flipper-face front"><span>00</span></div><div class="flipper-face back"><span>00</span></div></div>
              </div>
              <span class="unit-label">HR</span>
            </div>
            <div class="flip-unit" data-unit="minutes">
              <div class="flip-card-wrapper">

    window.convertQuickRate = function(type) {
      const krwInput = document.getElementById('quick-krw');
      const twdInput = document.getElementById('quick-twd');
      if (type === 'krw') {
        const krw = Number(krwInput.value);
        if (!krwInput.value || isNaN(krw) || krw <= 0) { twdInput.value = ''; updateTaxBanner(0); return; }
        twdInput.value = Math.round(krw / EXCHANGE_RATE);
        updateTaxBanner(krw);
      } else {
        const twd = Number(twdInput.value);
        if (!twdInput.value || isNaN(twd) || twd <= 0) { krwInput.value = ''; updateTaxBanner(0); return; }
        const krw = Math.round(twd * EXCHANGE_RATE);
        krwInput.value = krw;
        updateTaxBanner(krw);
      }
    };

    function updateTaxBanner(krwVal) {
      const banner = document.getElementById('tax-banner');
      const statusText = document.getElementById('tax-status-text');
      const threshold = 15000;
      if (krwVal >= threshold) {
        banner.className = 'tax-free-banner reached';
        statusText.innerText = '✨ 已達退稅門檻';
      } else {
        const diff = threshold - krwVal;
        banner.className = 'tax-free-banner';
        statusText.innerText = `再 ₩${diff.toLocaleString()} 達退稅門檻`;
      }
    }

    /* 翻頁時鐘倒數 */
    function updateClockUnit(unitName, value) {
      const formatted = String(value).padStart(2, '0');
      const unitElem = document.querySelector(`[data-unit="${unitName}"]`);
      if (!unitElem) return;

      const topHalf = unitElem.querySelector('.flip-card-half.top span');
      const bottomHalf = unitElem.querySelector('.flip-card-half.bottom span');
      const flipper = unitElem.querySelector('.flip-card-flipper');
      const frontSpan = flipper.querySelector('.flipper-face.front span');
      const backSpan = flipper.querySelector('.flipper-face.back span');

      const currentText = topHalf.textContent;
      if (currentText !== formatted) {
        frontSpan.textContent = currentText;
        backSpan.textContent = formatted;
        flipper.classList.remove('flipping');
        void flipper.offsetWidth;
        flipper.classList.add('flipping');
        topHalf.textContent = formatted;
        setTimeout(() => {
          bottomHalf.textContent = formatted;
          flipper.classList.remove('flipping');
        }, 500);
      }
    }

    function startSingleCountdown() {
      const targetDate = new Date(`2026-12-31T18:00:00`);
      function tick() {
        const now = new Date();
        const diff = targetDate - now;
        if (diff <= 0) {
          updateClockUnit('days', 0); updateClockUnit('hours', 0);
          updateClockUnit('minutes', 0); updateClockUnit('seconds', 0);
          return;
        }
        updateClockUnit('days', Math.floor(diff / (1000 * 60 * 60 * 24)));
        updateClockUnit('hours', Math.floor((diff / (1000 * 60 * 60)) % 24));
        updateClockUnit('minutes', Math.floor((diff / 1000 / 60) % 60));
        updateClockUnit('seconds', Math.floor((diff / 1000) % 60));
      }
      setInterval(tick, 1000); tick();
    }
    startSingleCountdown();

    /* 85% 寬鬆觸發手勢下拉關閉機制 */
    function initBottomSheetGestures() {
    const sheet = document.getElementById('bottom-sheet');
    if (!sheet) return;
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    // 這裡我們之前用的是 header，如果要整個視窗都能拉，可以確認這裡
    const header = sheet.querySelector('.sheet-header') || sheet;

    header.addEventListener('touchstart', (e) => {
        startY = e.touches[0].clientY;
        isDragging = true;
        sheet.style.transition = 'none';
    }, { passive: true });

    header.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentY = e.touches[0].clientY;
        const diff = currentY - startY;
        
        if (diff > 0) {
            sheet.style.transform = `translateY(${diff}px)`;
            e.preventDefault(); 
        }
    }, { passive: false }); 

    header.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        sheet.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
        const diff = currentY - startY;
        const sheetHeight = sheet.clientHeight;

        if (diff > sheetHeight * 0.15) { // 或 0.85
            closeSheet();
        } else {
            sheet.style.transform = 'translateY(0)';
        }
    });
}

    let selectedPayers = ['All'];
    window.selectPayerChip = function(payerName) {
      const chips = document.querySelectorAll('.payer-chip');
      if (payerName === 'All') {
        selectedPayers = ['All'];
      } else {
        if (selectedPayers.includes('All')) selectedPayers = [];
        const idx = selectedPayers.indexOf(payerName);
        if (idx > -1) selectedPayers.splice(idx, 1);
        else selectedPayers.push(payerName);
        if (selectedPayers.length === 0) selectedPayers = ['All'];
      }
      chips.forEach(chip => {
        const p = chip.getAttribute('data-payer');
        if (selectedPayers.includes(p)) chip.classList.add('selected');
        else chip.classList.remove('selected');
      });
    };

    let allSelectedState = false;
    window.toggleSelectAllPayers = function() {
      const chips = document.querySelectorAll('.payer-chip');
      allSelectedState = !allSelectedState;
      if (allSelectedState) selectedPayers = ['Jase', 'Jessie', 'Jewel', 'Kay'];
      else selectedPayers = ['All'];
      chips.forEach(chip => {
        const p = chip.getAttribute('data-payer');
        if (selectedPayers.includes(p) || (allSelectedState && p !== 'All')) {
          if(p !== 'All' || !allSelectedState) chip.classList.add('selected');
        } else chip.classList.remove('selected');
        if(!allSelectedState && p === 'All') chip.classList.add('selected');
        else if(allSelectedState && p === 'All') chip.classList.remove('selected');
      });
    };

    window.createIllustrationFirework = function(x, y) {
      const rayCount = 24;
      const colors = ['#BBB7E5', '#F7DFDF', '#DAE9FA', '#EFBDBD', '#B6C687', '#FAF6C8'];
      for (let i = 0; i < rayCount; i++) {
        const ray = document.createElement('div');
        const color = colors[Math.floor(Math.random() * colors.length)];
        ray.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:2.5px;height:${30 + Math.random() * 35}px;background-color:${color};border-radius:2px;pointer-events:none;z-index:99999;transform-origin:top center;opacity:1;`;
        const angle = (360 / rayCount) * i + (Math.random() * 8 - 4);
        const distance = 50 + Math.random() * 50;
        ray.style.transform = `rotate(${angle}deg) scaleY(0.2)`;
        ray.style.transition = 'all 0.8s cubic-bezier(0.1, 0.8, 0.3, 1)';
        document.body.appendChild(ray);
        requestAnimationFrame(() => {
          ray.style.transform = `rotate(${angle}deg) translateY(${distance}px) scaleY(1.2)`;
          ray.style.opacity = '0';
        });
        setTimeout(() => ray.remove(), 800);
      }
    };
  </script>
</body>
</html>

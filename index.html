<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釜山行程手冊</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: #1d1d1f;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .day-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .day-title {
            font-size: 18px;
            font-weight: bold;
            color: #007aff;
            margin-bottom: 10px;
            border-bottom: 2px solid #007aff;
            padding-bottom: 5px;
        }
        ul {
            padding-left: 20px;
            margin: 0;
        }
        li {
            margin-bottom: 8px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>🇰🇷 釜山精彩行程手冊</h1>

    <div class="day-card">
        <div class="day-title">Day 1：海雲台與海岸列車</div>
        <ul>
            <li><strong>10:00</strong> 抵達金海機場 / 飯店 Check-in</li>
            <li><strong>12:30</strong> 午餐：海雲台傳統市場（豬肉湯飯）</li>
            <li><strong>15:00</strong> 藍線公園 Sky Capsule 天空膠囊火車</li>
            <li><strong>18:30</strong> 晚餐：海雲台烤肉 / 欣賞海景夜景</li>
        </ul>
    </div>

    <div class="day-card">
        <div class="day-title">Day 2：甘川洞文化村與南浦洞</div>
        <ul>
            <li><strong>10:00</strong> 甘川洞文化村（穿韓服、拍小王子）</li>
            <li><strong>13:00</strong> 午餐：南浦洞美食街（冷麵、黑糖餅）</li>
            <li><strong>15:30</strong> 龍頭山公園 & 釜山塔</li>
            <li><strong>18:00</strong> 札嘎其市場享用新鮮海鮮</li>
        </ul>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- 1. 設定 App 標題與 iOS 專用主畫面名稱 -->
  <title>釜山之旅</title>
  <meta name="apple-mobile-web-app-title" content="釜山之旅">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- 2. 設定 App 自訂彩色圖示 (ImgBB 直鏈) -->
  <link rel="apple-touch-icon" href="https://i.ibb.co/0ppX3mmH/IMG-6699.jpg">
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/0ppX3mmH/IMG-6699.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f4ef;
      color: #333;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 倒數計時器整體外框容器 */
    .countdown-widget {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    /* 雙 Team 左右分欄佈局 */
    .teams-container {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .team-card {
      flex: 1;
      min-width: 0; /* 防止子元素溢出 */
      background-color: #fcfbf9;
      border-radius: 14px;
      padding: 10px 8px;
      border: 1px solid #f0eae1;
    }

    /* 隊伍資訊文字排版 */
    .team-header {
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .team-title {
      font-size: 14px;
      font-weight: 800;
      color: #2b2b2b;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .team-subinfo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3px;
      font-size: 11px;
      color: #666;
    }

    .member-names {
      font-weight: 600;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrival-date {
      color: #888;
      font-weight: 500;
      white-space: nowrap;
    }

    /* 翻頁鐘單排卡片網格 */
    .flip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    /* 復古斜紋翻頁卡片主體 */
    .flip-unit {
      background-color: #e56b6f; /* 復古珊瑚紅底色 */
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.12) 3px,
        rgba(0, 0, 0, 0.12) 5px
      );
      border-radius: 6px;
      aspect-ratio: 0.85;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /* 中間縫隙黑切線 */
    .flip-unit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1.5px;
      background-color: #1a1a1a;
      transform: translateY(-50%);
      z-index: 2;
    }

    /* 左右兩側固定扣卡槽 */
    .flip-unit::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 1.5px;
      right: 1.5px;
      height: 6px;
      border-left: 2px solid #1a1a1a;
      border-right: 2px solid #1a1a1a;
      transform: translateY(-50%);
      z-index: 3;
    }

    /* 數字數字樣式 */
    .flip-num {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 900;
      color: #111111;
      line-height: 1;
      z-index: 1;
      margin-bottom: 2px;
    }

    /* 標籤容器（英文靠左、中文靠右） */
    .flip-labels {
      position: absolute;
      bottom: 2px;
      left: 3px;
      right: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 7px;
      font-weight: 700;
      color: #111111;
      z-index: 4;
      line-height: 1;
      opacity: 0.85;
    }

    .label-en { text-align: left; }
    .label-zh { text-align: right; }
  </style>
</head>
<body>

  <!-- 復古雙 Team 倒數計時器 Widget -->
  <div class="countdown-widget">
    <div class="teams-container">
      
      <!-- Team 1 卡片 -->
      <div class="team-card">
        <div class="team-header">
          <div class="team-title">Team 1</div>
          <div class="team-subinfo">
            <span class="member-names">Jase Jessie</span>
            <span class="arrival-date">12/27到達</span>
          </div>
        </div>
        <div class="flip-grid">
          <div class="flip-unit">
            <div class="flip-num" id="t1-days">00</div>
            <div class="flip-labels"><span class="label-en">DAY</span><span class="label-zh">天</span></div>
          </div>
          <div class="flip-unit">
            <div class="flip-num" id="t1-hours">00</div>
            <div class="flip-labels"><span class="label-en">HR</span><span class="label-zh">時</span></div>
          </div>
          <div class="flip-unit">
            <div class="flip-num" id="t1-mins">00</div>
            <div class="flip-labels"><span class="label-en">MIN</span><span class="label-zh">分</span></div>
          </div>
          <div class="flip-unit">
            <div class="flip-num" id="t1-secs">00</div>
            <div class="flip-labels"><span class="label-en">SEC</span><span class="label-zh">秒</span></div>
          </div>
        </div>
      </div>

      <!-- Team 2 卡片 -->
      <div class="team-card">
        <div class="team-header">
          <div class="team-title">Team 2</div>
          <div class="team-subinfo">
            <span class="member-names">Jewel Kay</span>
            <span class="arrival-date">12/31到達</span>
          </div>
        </div>
        <div class="flip-grid">
          <div class="flip-unit">
            <div class="flip-num" id="t2-days">00</div>
            <div class="flip-labels"><span class="label-en">DAY</span><span class="label-zh">天</span></div>
          </div>
          <div class="flip-unit">
            <div class="flip-num" id="t2-hours">00</div>
            <div class="flip-labels"><span class="label-en">HR</span><span class="label-zh">時</span></div>
          </div>
          <div class="flip-unit">
            <div class="flip-num" id="t2-mins">00</div>
            <div class="flip-labels"><span class="label-en">MIN</span><span class="label-zh">分</span></div>
          </div>
          <div class="flip-unit">
            <div class="flip-num" id="t2-secs">00</div>
            <div class="flip-labels"><span class="label-en">SEC</span><span class="label-zh">秒</span></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 設定兩組團隊抵達的目標時間 (請根據實際出發年份/時間修改，如 2026-12-27T10:00:00)
    const targetTeam1 = new Date("2026-12-27T10:00:00").getTime();
    const targetTeam2 = new Date("2026-12-31T10:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();

      // 計算 Team 1 時間差
      const diff1 = targetTeam1 - now;
      if (diff1 > 0) {
        document.getElementById('t1-days').innerText = String(Math.floor(diff1 / (1000 * 60 * 60 * 24))).padStart(2, '0');
        document.getElementById('t1-hours').innerText = String(Math.floor((diff1 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
        document.getElementById('t1-mins').innerText = String(Math.floor((diff1 % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        document.getElementById('t1-secs').innerText = String(Math.floor((diff1 % (1000 * 60)) / 1000)).padStart(2, '0');
      } else {
        document.getElementById('t1-days').innerText = "00";
        document.getElementById('t1-hours').innerText = "00";
        document.getElementById('t1-mins').innerText = "00";
        document.getElementById('t1-secs').innerText = "00";
      }

      // 計算 Team 2 時間差
      const diff2 = targetTeam2 - now;
      if (diff2 > 0) {
        document.getElementById('t2-days').innerText = String(Math.floor(diff2 / (1000 * 60 * 60 * 24))).padStart(2, '0');
        document.getElementById('t2-hours').innerText = String(Math.floor((diff2 % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
        document.getElementById('t2-mins').innerText = String(Math.floor((diff2 % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        document.getElementById('t2-secs').innerText = String(Math.floor((diff2 % (1000 * 60)) / 1000)).padStart(2, '0');
      } else {
        document.getElementById('t2-days').innerText = "00";
        document.getElementById('t2-hours').innerText = "00";
        document.getElementById('t2-mins').innerText = "00";
        document.getElementById('t2-secs').innerText = "00";
      }
    }

    // 每秒更新一次時間
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>

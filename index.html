<style>
:root {
--bg-color: #F7F6F2;
--card-bg: #FFFFFF;
--text-main: #2C2C2A;
--text-sub: #787774;
--accent-wood: #8C7A6B;
--accent-soft-blue: #5B8296;
--tag-food: #E07A5F;
--tag-spot: #3D405B;
--tag-buy: #81B29A;
--tag-story: #F2CC8F;
--border-color: #E8E6E1;
/* 莫蘭迪大地色系翻頁鐘變數 */
--flip-bg: #C58C80;
--flip-stripe: rgba(0, 0, 0, 0.08);
--flip-text: #222222;
--flip-subtext: #111111;
--flip-divider: rgba(0, 0, 0, 0.25);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
-webkit-tap-highlight-color: transparent;
}
body {
background-color: var(--bg-color);
color: var(--text-main);
padding-bottom: 95px;
padding-top: env(safe-area-inset-top);
letter-spacing: 0.3px;
}
header {
background-color: var(--card-bg);
padding: 16px 20px;
position: sticky;
top: 0;
z-index: 100;
border-bottom: 1px solid var(--border-color);
display: flex;
justify-content: space-between;
align-items: center;
}
header h1 {
font-size: 18px;
font-weight: 600;
color: var(--text-main);
}
.container {
padding: 16px;
max-width: 600px;
margin: 0 auto;
}
.tab-content {
display: none;
}
.tab-content.active {
display: block;
}
/* 天氣與倒數卡片 */
.hero-card {
background: var(--card-bg);
border-radius: 16px;
padding: 18px;
margin-bottom: 16px;
border: 1px solid var(--border-color);
}
.weather-box {
display: flex;
justify-content: space-between;
align-items: center;
padding-bottom: 14px;
margin-bottom: 14px;
border-bottom: 1px dashed var(--border-color);
}
.weather-temp {
font-size: 22px;
font-weight: 600;
color: var(--accent-soft-blue);
}
/* 3D 翻頁倒數計時器 (雙欄併排) */
.teams-container {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}
.team-card {
background: var(--card-bg);
border-radius: 14px;
padding: 12px 10px;
border: 1px solid var(--border-color);
}
.team-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
}
.team-title {
font-weight: 700;
font-size: 13px;
color: var(--text-main);
}
.arrival-date {
font-size: 11px;
color: var(--text-sub);
}
.flip-clock {
display: flex;
gap: 4px;
justify-content: space-between;
}
.flip-unit {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
}
.flip-card-wrapper {
position: relative;
width: 100%;
aspect-ratio: 0.85;
perspective: 300px;
border-radius: 6px;
overflow: hidden;
box-shadow: 0 2px 5px rgba(0,0,0,0.08);
background-color: var(--flip-bg);
background-image: repeating-linear-gradient(
-45deg,
transparent,
transparent 4px,
var(--flip-stripe) 4px,
var(--flip-stripe) 6px
);
}
.flip-card-wrapper::before,
.flip-card-wrapper::after {
content: '';
position: absolute;
top: 50%;
width: 2.5px;
height: 7px;
background-color: #111;
transform: translateY(-50%);
z-index: 20;
border-radius: 1px;
}
.flip-card-wrapper::before { left: 0; }
.flip-card-wrapper::after { right: 0; }
.card-face {
position: absolute;
left: 0;
right: 0;
width: 100%;
height: 50%;
overflow: hidden;
background-color: inherit;
background-image: inherit;
color: var(--flip-text);
font-weight: 700;
font-size: min(4.5vw, 18px);
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
display: flex;
justify-content: center;
backface-visibility: hidden;
}
.card-face.top {
top: 0;
align-items: flex-end;
border-bottom: 0.5px solid var(--flip-divider);
}
.card-face.bottom {
bottom: 0;
align-items: flex-start;
border-top: 0.5px solid var(--flip-divider);
}
.card-face.top span { transform: translateY(50%); }
.card-face.bottom span { transform: translateY(-50%); }
.flip-card {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 50%;
overflow: hidden;
transform-style: preserve-3d;
transform-origin: bottom;
z-index: 10;
will-change: transform;
background-color: inherit;
background-image: inherit;
}
.flip-card .card-face.top {
position: absolute;
width: 100%;
height: 100%;
top: 0;
left: 0;
}
.unit-label {
position: absolute;
bottom: 2px;
left: 3px;
font-size: 7px;
font-weight: 800;
color: var(--flip-subtext);
letter-spacing: 0.2px;
z-index: 15;
pointer-events: none;
}
/* 分類頁籤按鈕 */
.category-scroll {
display: flex;
gap: 8px;
overflow-x: auto;
padding-bottom: 10px;
margin-bottom: 12px;
scrollbar-width: none;
}
.category-scroll::-webkit-scrollbar {
display: none;
}
.cat-btn {
white-space: nowrap;
padding: 6px 14px;
border-radius: 20px;
background: var(--card-bg);
border: 1px solid var(--border-color);
font-size: 13px;
color: var(--text-sub);
cursor: pointer;
}
.cat-btn.active {
background: var(--accent-wood);
color: white;
border-color: var(--accent-wood);
}
/* 景點與美食卡片 */
.item-card {
background: var(--card-bg);
border-radius: 14px;
padding: 16px;
margin-bottom: 12px;
border: 1px solid var(--border-color);
position: relative;
}
.card-top {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 6px;
}
.item-title {
font-size: 16px;
font-weight: 600;
color: var(--text-main);
}
.card-actions {
display: flex;
gap: 10px;
}
.icon-btn {
background: none;
border: none;
font-size: 16px;
color: #C5C5C0;
cursor: pointer;
}
.icon-btn.active-heart {
color: #E07A5F;
}
.tag-container {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin: 8px 0;
}
.tag {
font-size: 11px;
padding: 3px 8px;
border-radius: 6px;
font-weight: 500;
}
.tag-food { background: #FDE8E2; color: var(--tag-food); }
.tag-spot { background: #E8EBF0; color: var(--tag-spot); }
.tag-buy  { background: #E8F3EE; color: #2D6A4F; }
.tag-story { background: #FEF5E7; color: #B57A12; }
.story-box {
font-size: 13px;
color: var(--text-sub);
line-height: 1.5;
margin-top: 6px;
background: var(--bg-color);
padding: 8px 10px;
border-radius: 8px;
}
.map-btn {
display: inline-flex;
align-items: center;
gap: 5px;
margin-top: 10px;
padding: 6px 12px;
background: #F0EDE6;
color: var(--accent-wood);
text-decoration: none;
border-radius: 8px;
font-size: 12px;
font-weight: 600;
}
.add-form {
background: var(--card-bg);
border-radius: 14px;
padding: 16px;
margin-bottom: 16px;
border: 1px solid var(--border-color);
}
.add-form input {
width: 100%;
padding: 10px 12px;
margin-bottom: 8px;
border: 1px solid var(--border-color);
border-radius: 8px;
font-size: 14px;
background: var(--bg-color);
}
.btn-submit {
width: 100%;
background: var(--accent-wood);
color: white;
border: none;
padding: 10px;
border-radius: 8px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
}
.account-summary {
background: var(--accent-wood);
color: white;
border-radius: 14px;
padding: 18px;
margin-bottom: 16px;
}
nav {
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(10px);
display: flex;
justify-content: space-around;
padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
border-top: 1px solid var(--border-color);
z-index: 100;
}
.nav-item {
display: flex;
flex-direction: column;
align-items: center;
color: var(--text-sub);
text-decoration: none;
font-size: 11px;
border: none;
background: none;
cursor: pointer;
}
.nav-item i {
font-size: 18px;
margin-bottom: 3px;
}
.nav-item.active {
color: var(--accent-wood);
font-weight: 600;
}
</style>
</head>

// 3D 翻頁核心
function updateFlipCard(unitElem, newValue) {
const formattedValue = String(newValue).padStart(2, '0');
const topFace = unitElem.querySelector('.card-face.top span');
const bottomFace = unitElem.querySelector('.card-face.bottom span');
const wrapper = unitElem.querySelector('.flip-card-wrapper');
const currentVal = topFace.textContent;
if (currentVal === formattedValue) return;
const flipCard = document.createElement('div');
flipCard.className = 'flip-card';
flipCard.innerHTML = ⁠<div class="card-face top"> <span>${currentVal}</span> </div>⁠;
wrapper.appendChild(flipCard);
topFace.textContent = formattedValue;
bottomFace.textContent = currentVal;
flipCard.style.transition = 'transform 0.25s ease-in';
requestAnimationFrame(() => {
flipCard.style.transform = 'rotateX(-90deg)';
});
setTimeout(() => {
bottomFace.textContent = formattedValue;
flipCard.remove();
}, 250);
}
function startCountdowns() {
const year = 2026;
const t1Date = new Date(⁠${year}-12-27T00:00:00⁠);
const t2Date = new Date(⁠${year}-12-31T00:00:00⁠);
function updateTeam(clockId, targetDate) {
const now = new Date();
const diff = targetDate - now;
if (diff <= 0) return;
const days = Math.floor(diff / (1000 * 60 * 60 * 24));
const hrs = Math.floor((diff / (1000 * 60 * 60)) % 24);
const mins = Math.floor((diff / 1000 / 60) % 60);
const secs = Math.floor((diff / 1000) % 60);
const clockElem = document.getElementById(clockId);
if (clockElem) {
updateFlipCard(clockElem.querySelector('[data-unit="days"]'), days);
updateFlipCard(clockElem.querySelector('[data-unit="hours"]'), hrs);
updateFlipCard(clockElem.querySelector('[data-unit="minutes"]'), mins);
updateFlipCard(clockElem.querySelector('[data-unit="seconds"]'), secs);
}
}
function tick() {
updateTeam('clock-team1', t1Date);
updateTeam('clock-team2', t2Date);
}
setInterval(tick, 1000);
tick();
}
startCountdowns();
window.switchTab = function(tabId, title, btnElement) {
document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
document.getElementById('tab-' + tabId).classList.add('active');
document.getElementById('page-title').innerText = title;
btnElement.classList.add('active');
};
let currentFilter = 'ALL';
window.filterCategory = function(cat, btn) {
document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
currentFilter = cat;
renderScheduleList();
};
function renderScheduleList() {
const scheduleList = document.getElementById('schedule-list');
scheduleList.innerHTML = '';
const filtered = currentFilter === 'ALL'
? presetData
: presetData.filter(i => i.cat === currentFilter);
filtered.forEach((item, index) => {
const card = document.createElement('div');
card.className = 'item-card';
const mapUrl = ⁠https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('釜山 ' + item.name)}⁠;
card.innerHTML = ⁠<div class="card-top"> <div class="item-title">${item.name}</div> <div class="card-actions"> <button class="icon-btn" onclick="toggleLocalFavorite(${index}, this)"> <i class="fa-regular fa-heart"></i> </button> </div> </div> <div class="tag-container"> <span class="tag ${item.type === 'food' ? 'tag-food' : 'tag-spot'}">${item.tag}</span> </div> <div class="story-box">${item.story}</div> <a href="${mapUrl}" target="_blank" class="map-btn"> <i class="fa-solid fa-location-dot"></i> Google Maps 導航 </a>⁠;
scheduleList.appendChild(card);
});
}
renderScheduleList();
window.addSchedule = async function() {
const title = document.getElementById('schedule-title').value;
const time = document.getElementById('schedule-time').value;
const note = document.getElementById('schedule-note').value;
if (!title) return alert('請輸入景點名稱！');
await addDoc(collection(db, "schedules"), {
title, time, note, isFavorite: false, createdAt: Date.now()
});
document.getElementById('schedule-title').value = '';
document.getElementById('schedule-time').value = '';
document.getElementById('schedule-note').value = '';
};
window.addExpense = async function() {
const item = document.getElementById('expense-item').value;
const amount = Number(document.getElementById('expense-amount').value);
const payer = document.getElementById('expense-payer').value;
if (!item || !amount) return alert('請填寫品項與金額！');
await addDoc(collection(db, "expenses"), {
item, amount, payer: payer || '公款', createdAt: Date.now()
});
document.getElementById('expense-item').value = '';
document.getElementById('expense-amount').value = '';
document.getElementById('expense-payer').value = '';
};
onSnapshot(collection(db, "expenses"), (snapshot) => {
const expensesList = document.getElementById('expenses-list');
const totalElement = document.getElementById('total-expense');
expensesList.innerHTML = '';
let total = 0;
snapshot.forEach((docSnap) => {
const data = docSnap.data();
total += data.amount;
const card = document.createElement('div');
card.className = 'item-card';
card.innerHTML = ⁠<div class="card-top"> <div class="item-title">${data.item}</div> <span style="color:var(--tag-food); font-weight:700;">₩ ${data.amount.toLocaleString()}</span> </div> <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">💳 付款人：${data.payer}</div>⁠;
expensesList.appendChild(card);
});
totalElement.innerText = ⁠₩ ${total.toLocaleString()}⁠;
});
